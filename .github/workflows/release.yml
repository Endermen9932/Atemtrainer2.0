name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: false
        default: ''

jobs:
  build:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          else
            VERSION=$(grep versionName app/build.gradle.kts | sed "s/.*versionName = \"//;s/\".*//")
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${VERSION}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Atemtrainer-${{ steps.version.outputs.version }}-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Atemtrainer ${{ steps.version.outputs.version }} (${{ steps.version.outputs.short_sha }})"
          body: |
            ## Atemtrainer ${{ steps.version.outputs.version }}

            **Debug APK** – signiert mit Android Debug Key.

            ### Installation
            1. APK herunterladen
            2. Auf Android-Gerät übertragen
            3. "Unbekannte Quellen" in den Einstellungen erlauben
            4. APK installieren

            **Commit:** `${{ github.sha }}`
          files: app/build/outputs/apk/debug/Atemtrainer-${{ steps.version.outputs.version }}-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
